name: Convert HK Bus Routes

on:
  workflow_dispatch:
  schedule:
    - cron: '37 21 * * *'  # Runs daily at 5:37 AM Hong Kong Time (21:37 UTC)

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Converter Script
        run: python -u converter.py api/transport/BusStopTime/bus_routes_google.json

      - name: Commit Updated Open Data to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/transport/BusStopTime/bus_routes_google.json
          git commit -m "Auto-update bus_routes_google.json" || echo "No changes to commit"
          git push

      - name: Deploy to Cloudflare Pages
        if: github.repository == 'YOUR_GITHUB_USERNAME/YOUR_REPO_NAME'  # Replace with actual username/repo
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=static-orangehk-net
