name: Convert HK Bus Routes

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'  # Runs daily at 5:30 AM Hong Kong Time (21:30 UTC)

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Converter Script
        run: python -u converter.py api/transport/BusStopTime/bus_routes_google.json

      - name: Commit and Push Updated File to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/transport/BusStopTime/bus_routes_google.json
          git commit -m "Auto-update bus_routes_google.json" || echo "No changes to commit"
          git push

      - name: Deploy to Cloudflare Pages
        if: github.repository == 'your-github-username/your-repo-name'  # Replace with your actual username/repo
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'your-cloudflare-pages-project-name'
          directory: '.'
